<text x="32" y="834" font-size="15" font-weight="bold" fill="#1f2328">grip</text>
<text x="32" y="856" font-size="13.5" fill="#475569">Pin locks the handle span in set holes</text>
<line x1="408" y1="790" x2="408" y2="640" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/>
<rect x="332" y="790" width="290" height="58" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="344" y="814" font-size="15" font-weight="bold" fill="#1f2328"><tspan fill="#b45309">F-046</tspan>  Enclosed moving mechanism</text>
<text x="344" y="836" font-size="13.5" fill="#475569">Spring, screw and motor fully covered</text>
<line x1="644" y1="790" x2="473" y2="604" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/>
<rect x="644" y="790" width="290" height="78" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="656" y="814" font-size="15" font-weight="bold" fill="#1f2328"><tspan fill="#b45309">F-016</tspan>  Force sensor between the</text>
<text x="656" y="834" font-size="15" font-weight="bold" fill="#1f2328">handles</text>
<text x="656" y="856" font-size="13.5" fill="#475569">Measures the squeeze force directly</text>
<line x1="956" y1="790" x2="655" y2="588" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/>
<rect x="956" y="790" width="290" height="78" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="968" y="814" font-size="15" font-weight="bold" fill="#1f2328"><tspan fill="#b45309">F-036</tspan>  Motor-driven spring</text>
<text x="968" y="834" font-size="15" font-weight="bold" fill="#1f2328">preload</text>
<text x="968" y="856" font-size="13.5" fill="#475569">Motor and lead screw set the resistance</text>
<line x1="1268" y1="790" x2="716" y2="612" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1268" y="790" width="290" height="58" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="1280" y="814" font-size="15" font-weight="bold" fill="#1f2328"><tspan fill="#b45309">F-N02</tspan>  Force-triggered back-off</text>
<text x="1280" y="836" font-size="13.5" fill="#475569">Same motor eases off past the limit</text>
<text x="40" y="918" font-size="12.5" fill="#8c959f">Not to scale. Concept illustration for Team 103, EGR 304, Fall 2026. Blue: grip sleeves · red: manual release and locking pin · yellow: force sensor · green: circuit board.</text>
