<rect x="1268" y="530" width="290" height="58" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="1280" y="554" font-size="15" font-weight="bold" fill="#1f2328"><tspan fill="#b45309">F-066</tspan>  USB CSV export</text>
<text x="1280" y="576" font-size="13.5" fill="#475569">Session records open in any spreadsheet</text>
<line x1="292" y1="790" x2="292" y2="598" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="790" width="290" height="78" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
