<text x="702" y="174" font-size="15" font-weight="bold" fill="#1f2328"><tspan fill="#b45309">F-N01</tspan>  One force reading for</text>
<text x="702" y="194" font-size="15" font-weight="bold" fill="#1f2328">limit, count and display</text>
<text x="702" y="216" font-size="13.5" fill="#475569">One sensor serves all three jobs</text>
